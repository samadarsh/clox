name: Deploy playground

# Builds the WebAssembly playground, tests it, and publishes it to GitHub
# Pages. Needs Pages enabled with "GitHub Actions" as the source (repository
# Settings -> Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # to publish to Pages
  id-token: write   # to prove the deployment comes from this workflow

# One deployment at a time; don't cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clox for WebAssembly
        run: make wasm-docker

      - name: Test the playground in headless Chromium
        run: make test-wasm-docker

      # Publish only the files the page needs, not the C code, tests or the
      # vendor build setup.
      - name: Collect the site
        run: |
          mkdir -p _site/vendor
          cp playground/index.html playground/style.css playground/app.js \
             playground/lox.js playground/share.js playground/worker.js \
             playground/examples.js playground/clox.js playground/clox.wasm _site/
          cp playground/vendor/codemirror.js _site/vendor/
          cp -r playground/vendor/fonts _site/vendor/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
