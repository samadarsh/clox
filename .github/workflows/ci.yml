name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button on GitHub, for re-running CI by hand (for
  # example when a GitHub outage drops the push event that normally starts it).
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.values }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Both Value representations from chapter 30 must keep working:
        # NaN boxing (the default) and the tagged union.
        values: [nan-boxing, tagged-union]
        include:
          - values: nan-boxing
            nan_boxing: 1
          - values: tagged-union
            nan_boxing: 0

    env:
      # The Makefile reads this, so every make step below uses the job's
      # representation.
      NAN_BOXING: ${{ matrix.nan_boxing }}
      ASAN_OPTIONS: abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      # Some Linux runner kernels use more address randomization than older
      # AddressSanitizer runtimes can handle, which makes ASan hang at startup.
      # Lowering it is the documented workaround and does no harm elsewhere.
      - name: Fix ASan on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Toolchain
        run: clang --version && python3 --version

      - name: Build (release, -Werror)
        run: make build

      - name: Test (release)
        run: make test

      - name: Test (AddressSanitizer + UndefinedBehaviorSanitizer)
        run: make test-asan

      - name: Test (GC on every allocation, under ASan)
        run: make test-stress

  # The browser playground: build clox with Emscripten, then run the page in
  # headless Chromium (examples through the Web Worker, errors, Stop). Both
  # tools come from pinned Docker images, see the Makefile.
  wasm:
    name: playground (wasm + headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clox for WebAssembly
        run: make wasm-docker

      - name: Test the playground in headless Chromium
        run: make test-wasm-docker
